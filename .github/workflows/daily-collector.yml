name: Daily Warangal opportunity discovery

on:
  schedule:
      - cron: '30 0 * * *' # 06:00 IST
        workflow_dispatch:

        permissions:
          contents: write

          jobs:
            collect:
                runs-on: ubuntu-latest
                    steps:
                          - uses: actions/checkout@v4
                                - uses: actions/setup-python@v5
                                        with:
                                                  python-version: '3.12'
                                                        - name: Discover official-source candidates
                                                                run: python collector.py
                                                                      - name: Save review queue
                                                                              run: |
                                                                                        git config user.name 'Opportunity Atlas Bot'
                                                                                                  git config user.email 'actions@github.com'
                                                                                                            git add data/review_candidates.json
                                                                                                                      git diff --cached --quiet || git commit -m 'Update daily opportunity review queue'
                                                                                                                                git push
                                                                                                                                
